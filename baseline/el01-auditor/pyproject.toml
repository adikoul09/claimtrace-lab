[project]
name = "el01"
version = "0.1.0"
description = "Claim-level reproducibility audits for ML papers: every claim traced to its code, its run and the exact log line."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Pinned: the versions that produced inputs/spike-matchdg/golden/.
    "numpy==1.22.3",
    "scipy==1.8.0",
    "typer",
    "pydantic",
    "pyyaml",
    "pypdf",
    "jinja2",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
api = ["anthropic"]

[project.scripts]
el01 = "el01.cli:app"
claimtrace = "el01.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["el01"]

[tool.pytest.ini_options]
testpaths = ["tests"]
