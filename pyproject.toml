[project]
name = "claimtrace-lab"
version = "0.1.0"
description = "ClaimTrace Lab: controller, agents and executors (lab/)"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.10",
    "google-genai>=2.29",
    "httpx>=0.28",
    "pymupdf>=1.28",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["lab/tests"]
